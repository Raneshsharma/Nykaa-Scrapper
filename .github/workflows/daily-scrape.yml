name: Daily Nykaa snapshot

# Scrapes every leaf category into Supabase daily, split across 8 parallel
# runners (8 IPs) to finish fast and spread load past Akamai.
on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST daily
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements-collector.txt
      - name: Collect shard ${{ matrix.shard }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVIEW_SALES_MULT: "20"
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "8"
        run: python run_all.py
