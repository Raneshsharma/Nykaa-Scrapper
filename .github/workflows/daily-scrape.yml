name: Daily Nykaa snapshot

# Runs once a day and writes a dated snapshot + estimates to Supabase.
on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST daily
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements-collector.txt

      - name: Run daily collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVIEW_SALES_MULT: "20"
        run: python run_all.py
